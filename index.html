<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Englisch Unit 1 – Worttrainer</title><style>:root{font-family:system-ui,-apple-system,Arial;color:#182337;background:#f3f6fb}*{box-sizing:border-box}main{max-width:760px;margin:24px auto;padding:0 14px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 4px 22px #172b4d12;margin-bottom:16px}h1{font-size:1.65rem;margin:0 0 8px}h2{font-size:1.1rem}p{line-height:1.5}.muted{color:#627083}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:120px;background:#f0f5ff;padding:12px;border-radius:12px}.stat strong{font-size:1.3rem;display:block}.bar{height:14px;background:#e3e9f4;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:#23845a;transition:width .2s}.prompt{font-size:1.9rem;font-weight:750;margin:18px 0 6px}input{font-size:1.15rem;width:100%;padding:14px;border:2px solid #bdc9d9;border-radius:12px}button{border:0;border-radius:12px;padding:12px 16px;background:#1856b4;color:white;font-size:1rem;font-weight:650;cursor:pointer}button.secondary{background:#e7edf8;color:#1e3658}button.danger{background:#a43b3b}button:disabled{opacity:.5}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.feedback{min-height:48px;margin:12px 0;font-weight:600}.good{color:#13764a}.bad{color:#b13e34}.small{font-size:.88rem}.errorrow{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f5;padding:8px 0;gap:10px}details{margin-top:8px}summary{cursor:pointer;font-weight:650}#next{display:none}</style></head><body><main><section class="panel"><h1>Englisch – Unit 1</h1><p class="muted">Deutsch → Englisch · 6 Wörter pro Gruppe · 3-mal hintereinander richtig · Schlussrunde für Fehler</p><div class="stats"><div class="stat">Gesamtfortschritt<strong id="percent">0 %</strong></div><div class="stat">Gelernt<strong id="learned">0 / 0</strong></div><div class="stat">Fehler<strong id="wrong">0</strong></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="small muted" id="stage"></div></section><section class="panel" id="training"><div class="small muted" id="group"></div><div class="prompt" id="german"></div><p class="muted" id="hint">Schreibe das englische Wort.</p><form id="form"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Englische Übersetzung" required><div class="buttons"><button id="check" type="submit">Prüfen</button><button id="next" type="button">Weiter →</button></div></form><div class="feedback" id="feedback" aria-live="polite"></div></section><section class="panel"><details><summary>Häufigste Fehler <span id="errorcount"></span></summary><div id="errors" class="small"></div></details><details><summary>Alle Vokabeln anzeigen</summary><div id="allwords" class="small"></div></details><div class="buttons"><button type="button" class="secondary" id="restart">Lernstand zurücksetzen</button></div></section></main><script>
const WORDS=[
['Amerikaner','American'],['Australien','Australia'],['australisch','Australian'],['schön','beautiful'],['Fahrrad','bike'],['langweilig','boring'],['Brasilien','Brazil'],['brasilianisch','Brazilian'],['britisch','British'],['China','China'],['chinesisch','Chinese'],['sauber','clean'],['kalt','cold'],['überfüllt','crowded'],['Währung','currency'],['gefährlich','dangerous'],['Diät','diet'],['schmutzig','dirty'],['niederländisch','Dutch'],['Erziehung','education'],['leer','empty'],['grossartig','great'],['heiss','hot'],['Indien','India'],
['indisch','Indian'],['interessant','interesting'],['Japan','Japan'],['japanisch','Japanese'],['Mexiko','Mexico'],['mexikanisch','Mexican'],['modern','modern'],['Neuseeland','New Zealand'],['neuseeländisch','New Zealand'],['geräuschvoll','noisy'],['alt','old'],['leise','quiet'],['Russland','Russia'],['russisch','Russian'],['sicher','safe'],['Spanien','Spain'],['spanisch','Spanish'],['Subjekte','subjects'],['die Niederlande','the Netherlands'],['Vereinigtes Königreich','the UK'],['die USA','the USA'],['Türkei','Turkey'],['türkisch','Turkish'],['hässlich','ugly']
];
const KEY='englishUnit1Trainer20261107v1',N=WORDS.length,ORDER=Array.from({length:N},(_,i)=>i);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}const fresh=()=>({order:shuffle([...ORDER]),group:0,streak:Array(N).fill(0),errors:Array(N).fill(0),history:[],phase:'main',review:[],reviewDone:[],right:0,wrong:0});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(s.order)||s.order.length!==N)throw 0}catch(e){s=fresh()}let current=null,locked=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function norm(t){return t.normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]$/,'')}function target(i){return WORDS[i][1]}function correct(i,ans){let a=norm(ans),t=norm(target(i));if(a===t)return true;const alternatives={'the UK':['UK','United Kingdom','the United Kingdom'],'the USA':['USA','US','the US','United States','the United States'],'bike':['bicycle'],'great':['excellent'],'beautiful':['pretty'],'quiet':['silent'],'hot':['warm'],'subjects':['school subjects'],'Dutch':['Netherlandish']};return (alternatives[target(i)]||[]).some(v=>norm(v)===a)}function currentGroup(){return s.order.slice(s.group*6,(s.group+1)*6)}function completeMain(){return s.streak.every(x=>x>=3)}function update(){let learned=s.streak.filter(x=>x>=3).length;let base=completeMain()?90:Math.floor(90*learned/N);let revTotal=s.review.length;let progress=s.phase==='done'?100:s.phase==='review'?90+Math.floor(10*(s.reviewDone.length/Math.max(1,revTotal))):base;$('percent').textContent=progress+' %';$('fill').style.width=progress+'%';$('learned').textContent=learned+' / '+N;$('wrong').textContent=s.wrong;$('stage').textContent=s.phase==='review'?'Schlussrunde: '+s.reviewDone.length+' von '+revTotal+' Fehleraufgaben geschafft':s.phase==='done'?'Alle Aufgaben abgeschlossen!':'Lernphase: 3 richtige Antworten in Folge pro Wort';$('errorcount').textContent='('+s.errors.filter(x=>x>0).length+' Wörter)';let errors=ORDER.filter(i=>s.errors[i]>0).sort((a,b)=>s.errors[b]-s.errors[a]);$('errors').innerHTML=errors.length?errors.map(i=>'<div class="errorrow"><span>'+escapeHTML(WORDS[i][0])+' → '+escapeHTML(WORDS[i][1])+'</span><b>'+s.errors[i]+'×</b></div>').join(''):'Noch keine Fehler.';$('allwords').innerHTML=WORDS.map(([de,en])=>'<div class="errorrow"><span>'+escapeHTML(de)+'</span><b>'+escapeHTML(en)+'</b></div>').join('')}
function escapeHTML(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function advancePhase(){if(s.phase==='main'){while(s.group<Math.ceil(N/6)&&currentGroup().every(i=>s.streak[i]>=3))s.group++;if(s.group>=Math.ceil(N/6)){s.phase='review';s.review=ORDER.filter(i=>s.errors[i]>0);s.reviewDone=[];if(!s.review.length)s.phase='done'}}if(s.phase==='review'&&s.reviewDone.length===s.review.length)s.phase='done'}
function choose(){advancePhase();if(s.phase==='done')return null;let pool=s.phase==='main'?currentGroup().filter(i=>s.streak[i]<3):s.review.filter(i=>!s.reviewDone.includes(i));let eligible=pool.filter(i=>!s.history.slice(-2).includes(i));if(!eligible.length){let fillers=(s.phase==='main'?currentGroup():s.review).filter(i=>!s.history.slice(-2).includes(i));if(fillers.length)eligible=fillers;else eligible=pool}let last=s.history[s.history.length-1];eligible=eligible.filter(i=>i!==last).length?eligible.filter(i=>i!==last):eligible;let min=Math.min(...eligible.map(i=>s.history.lastIndexOf(i)));let candidates=eligible.filter(i=>s.history.lastIndexOf(i)===min);return candidates[Math.floor(Math.random()*candidates.length)]}
function show(){current=choose();locked=false;$('feedback').textContent='';$('next').style.display='none';$('check').style.display='inline-block';$('answer').disabled=false;$('answer').value='';if(current===null){$('group').textContent='Fertig!';$('german').textContent='Bravo! 🎉';$('hint').textContent='Du hast alle Wörter und die Schlussrunde geschafft.';$('form').style.display='none'}else{$('form').style.display='block';$('german').textContent=WORDS[current][0];$('hint').textContent='Englische Übersetzung eingeben';$('group').textContent=s.phase==='review'?'Schlussrunde · Fehlerwörter':`Gruppe ${s.group+1} von ${Math.ceil(N/6)} · ${currentGroup().length} Wörter`;$('answer').focus()}update();save()}
$('form').addEventListener('submit',e=>{e.preventDefault();if(locked)return;let ans=$('answer').value;if(!ans.trim())return;locked=true;let ok=correct(current,ans);s.history.push(current);if(s.history.length>30)s.history=s.history.slice(-30);if(ok){s.right++;if(s.phase==='main')s.streak[current]=Math.min(3,s.streak[current]+1);else if(!s.reviewDone.includes(current))s.reviewDone.push(current);$('feedback').className='feedback good';$('feedback').textContent='✓ Richtig! '+target(current)}else{s.wrong++;s.errors[current]++;if(s.phase==='main')s.streak[current]=0;$('feedback').className='feedback bad';$('feedback').textContent='✗ Richtig wäre: '+target(current)+'. Dieses Wort kommt nach zwei anderen nochmals.'}save();update();$('answer').disabled=true;$('check').style.display='none';$('next').style.display='inline-block';$('next').focus()});$('next').addEventListener('click',show);$('restart').addEventListener('click',()=>{if(confirm('Wirklich den gesamten Lernfortschritt löschen und neu starten?')){s=fresh();show()}});show();
</script></body></html>
